<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Phone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .form-label {
      color: #ccc;
    }
    .form-control {
      background-color: #333;
      color: #e0e0e0;
      border: 1px solid #555;
    }
    .form-control:focus {
      background-color: #444;
      color: #e0e0e0;
      border-color: #00bcd4;
      box-shadow: 0 0 0 0.2rem rgba(0,188,212,.25);
    }
    .btn-primary {
      background-color: #00bcd4;
      border: none;
    }
    .btn-secondary {
      background-color: #555;
      border: none;
    }
    .btn-danger {
      background-color: #f44336;
      border: none;
    }
    .list-group-item {
      background-color: #333;
      border: 1px solid #444;
      color: #e0e0e0;
    }
    .list-group-item:hover {
      background-color: #444;
      cursor: pointer;
    }
    h1, h3 {
      color: #00bcd4;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4">Galaxy Phone Contacts</h1>
    <div class="main-grid">
      <div>
        <div class="card shadow p-4">
          <form id="contactForm">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" id="address" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="text" id="phone" class="form-control" required>
            </div>
            <div class="d-flex flex-column gap-2">
              <button type="submit" class="btn btn-primary">Add Friend</button>
              <button type="button" id="clearBtn" class="btn btn-secondary">Clear Fields</button>
            </div>
          </form>
        </div>
      </div>

      <div>
        <h3>📖 Friend List</h3>
        <ul id="friendList" class="list-group mb-3"></ul>
        <button type="button" id="removeBtn" class="btn btn-danger w-100">Remove Last Friend</button>
      </div>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('name');
    const addressInput = document.getElementById('address');
    const phoneInput = document.getElementById('phone');
    const contactForm = document.getElementById('contactForm');
    const friendList = document.getElementById('friendList');
    const clearBtn = document.getElementById('clearBtn');
    const removeBtn = document.getElementById('removeBtn');

    let friends = JSON.parse(localStorage.getItem('friends')) || [];

    function saveToLocalStorage() {
      localStorage.setItem('friends', JSON.stringify(friends));
    }

    function renderFriends() {
      friendList.innerHTML = '';
      friends.forEach((friend) => {
        const li = document.createElement('li');
        li.className = 'list-group-item list-group-item-action';
        li.textContent = friend.name;
        li.addEventListener('click', () => {
          nameInput.value = friend.name;
          addressInput.value = friend.address;  
          phoneInput.value = friend.phone;
        });
        friendList.appendChild(li);
      });
    }

    contactForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newFriend = {
        name: nameInput.value,
        address: addressInput.value, 
        phone: phoneInput.value
      };
      friends.push(newFriend);
      saveToLocalStorage();
      renderFriends();
      contactForm.reset();
    });

    clearBtn.addEventListener('click', () => {
      contactForm.reset();
    });

    removeBtn.addEventListener('click', () => {
      if (friends.length > 0) {
        friends.pop();
        saveToLocalStorage();
        renderFriends();
      }
    });

    renderFriends();
  </script>
</body>
</html>
